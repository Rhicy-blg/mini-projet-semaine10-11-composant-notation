<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composant de notation interactif</title>
    <link rel="icon" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="carte">
        <div class="icon-star">
            <img src="images/icon-star.svg" alt="icone de l'etoile">
        </div>
        <h1>How did we do</h1>
        <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our
            offering!</p>
        <form>
            <div class="notes">
                <input type="radio" name="note" id="note-1" value="1">
                <label for="note-1">1</label>

                <input type="radio" name="note" id="note-2" value="2">
                <label for="note-2">2</label>

                <input type="radio" name="note" id="note-3" value="3">
                <label for="note-3">3</label>

                <input type="radio" name="note" id="note-4" value="4">
                <label for="note-4">4</label>

                <input type="radio" name="note" id="note-5" value="5">
                <label for="note-5">5</label>
            </div>
            <button type="submit">Submit</button>
        </form>

    </main>
    <script src="script.js"></script>
</body>

</html>
